plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.dayeon.today'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dayeon.today'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // 항상 같은 서명키로 빌드해야 덮어쓰기 설치(업데이트) 때 기록이 지워지지 않아요.
    signingConfigs {
        release {
            storeFile file('today.keystore')
            storePassword 'today-study-1'
            keyAlias 'today'
            keyPassword 'today-study-1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    // tablet = 기존 태블릿용(같은 앱 ID라 기존 설치 위에 업데이트) · mobile = 휴대폰 세로용(별도 앱)
    flavorDimensions 'device'
    productFlavors {
        tablet {
            dimension 'device'
            manifestPlaceholders = [orient: 'unspecified']
        }
        mobile {
            dimension 'device'
            applicationIdSuffix '.mobile'
            versionName '1.0'
            manifestPlaceholders = [orient: 'portrait']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
