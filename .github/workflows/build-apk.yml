name: APK 만들기

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 안드로이드 SDK 확인
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 글꼴 내려받기
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/Jua-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/jua/Jua-Regular.ttf" || echo "Jua 글꼴을 받지 못했어요"
          curl -fsSL -o app/src/main/assets/fonts/Fredoka.ttf "https://github.com/google/fonts/raw/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf" || echo "Fredoka 글꼴을 받지 못했어요"
      - name: APK 빌드
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk today-study.apk
      - uses: actions/upload-artifact@v4
        with:
          name: today-study
          path: today-study.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "v1.0.${{ github.run_number }}" out/*.apk \
            --repo "${{ github.repository }}" \
            --title "오늘공부 v1.0.${{ github.run_number }}" \
            --notes "today-study.apk 를 눌러 내려받아 설치하세요. (안드로이드 태블릿·폰)"
