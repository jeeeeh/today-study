name: 가족 앱 올리기

on:
  push:
    branches: [ main ]
    paths: [ 'family/**', '.github/workflows/family.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: family 릴리스에 APK 올리기 (최신 릴리스는 그대로 오늘공부)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view family >/dev/null 2>&1; then
            gh release create family --title "가족 앱" --notes "가족용 앱" --latest=false
          fi
          gh release upload family family/*.apk --clobber
