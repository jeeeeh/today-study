name: 오늘단어 만들기

on:
  push:
    branches: [ main ]
    paths: [ 'today-words/**', '.github/workflows/words.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: today-words
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 안드로이드 SDK 확인
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 글꼴 내려받기
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/Jua-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/jua/Jua-Regular.ttf" || echo "Jua 글꼴을 받지 못했어요"
          curl -fsSL -o app/src/main/assets/fonts/Fredoka.ttf "https://github.com/google/fonts/raw/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf" || echo "Fredoka 글꼴을 받지 못했어요"
      - name: APK 빌드
        run: gradle assembleTabletRelease assembleMobileRelease --no-daemon --stacktrace
      - name: 파일 이름 정리
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/tablet/release/app-tablet-release.apk ../out/today-words.apk
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk ../out/today-words_for_mobile_ver1.0.apk
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release view words --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create words --repo "${{ github.repository }}" --latest=false \
              --title "오늘단어 (영어·일본어 단어장)" \
              --notes "휴대폰: today-words_for_mobile_ver1.0.apk (오늘단어_for_mobile_ver1.0) · 태블릿: today-words.apk"
          gh release upload words out/*.apk --repo "${{ github.repository }}" --clobber
